<form class="panel padded slide-editor" method="post" action="/admin/slides" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ slide.id if slide else '' }}"><h3>{{ 'Слайд №' ~ slide.id if slide else 'Добавить слайд' }}</h3><div class="form-grid"><div><label>Заголовок<input name="title" value="{{ slide.title if slide else '' }}" required maxlength="100"></label><label>Описание<textarea name="subtitle" maxlength="400">{{ slide.subtitle if slide else '' }}</textarea></label><div class="two-cols"><label>Текст кнопки<input name="button" value="{{ slide.button if slide else 'Выбрать роллы' }}" required maxlength="40"></label><label>Ссылка на раздел<input name="target" value="{{ slide.target if slide else '#catalog' }}" required maxlength="150"></label></div><p class="hint">#catalog — всё меню; #category-1 — категория с ID 1.</p></div><div>{% if slide and slide.photo %}<img class="slide-thumb" src="/admin/media/{{ slide.photo }}" alt="Фото слайда"><label class="check"><input type="checkbox" name="remove_photo">Удалить фото</label>{% endif %}<label>Изображение<input type="file" name="photo" accept="image/jpeg,image/png,image/webp"></label><label>Порядок<input type="number" name="position" value="{{ slide.position if slide else 0 }}"></label><label class="check"><input type="checkbox" name="active" {{ 'checked' if not slide or slide.active }}>Показывать на сайте</label></div></div><div class="form-actions"><button class="primary">{{ 'Сохранить слайд' if slide else 'Добавить слайд' }}</button>{% if slide %}<button name="delete" value="1" class="danger" formnovalidate>Удалить слайд</button>{% endif %}</div></form>
