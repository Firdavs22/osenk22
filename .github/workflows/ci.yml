name: Check bot and admin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt -c requirements.lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run isolated tests without real Telegram credentials
        run: python -m pytest tests -q
      - name: Check Linux installer syntax
        run: |
          bash -n deploy/install.sh
          bash -n deploy/setup-max-ca.sh
